# Define the stages of the pipeline. Jobs in earlier stages run before jobs in later stages.
stages:
  - test
  - build
  - publish
  - deploy

# Define when pipelines should run to avoid wasting resources. 
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'web' # Allows manual runs

# Default settings applied to all jobs
default:
  interruptible: true # Allows newer pipelines to cancel older, redundant ones on the same branch.

.backend-base:
  before_script:
    - cd Backend/stage
    - chmod +x mvnw  
  after_script:
    - cd ..
.frontend-base:
  before_script:
    - cd Frontend
  after_script:
    - cd ..


backend-test:
  stage: test
  extends: .backend-base
  image: eclipse-temurin:17-jdk-jammy 
  services:
    # This starts a temporary PostgreSQL database just for this job.
    - name: postgres:15-alpine
      alias: postgres_db
  variables:
    # These variables are passed to the Spring Boot application during the test run.
    SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres_db:5432/myapp"
    SPRING_DATASOURCE_USERNAME: "myuser"
    SPRING_DATASOURCE_PASSWORD: "mypassword"
    POSTGRES_DB: "myapp"
    POSTGRES_USER: "myuser"
    POSTGRES_PASSWORD: "mypassword"
  script:
    - ./mvnw verify # Verify the project and run tests
    - ./mvnw jacoco:report # Generate JaCoCo test coverage report
  artifacts:
    when:
      always: true # Always save these artifacts, even if the job fails
    paths:
      - Backend/stage/target/surefire-reports/ # Unit Test reports
      - Backend/stage/target/failsafe-reports/ # Integration Test reports
      - Backend/stage/target/site/jacoco/ # JaCoCo coverage report
      - Backend/stage/target/checkstyle-result.xml # Checkstyle report
      - Backend/stage/target/*.jar
    reports:
      junit: Backend/stage/target/surefire-reports/*.xml # JUnit test reports
      junit: Backend/stage/target/failsafe-reports/*.xml # Integration test reports
    expire_in: 1 week   
  cache: # Cache Maven dependencies to speed up subsequent runs
    key: 
      files:
        - Backend/stage/pom.xml
    paths:
      - Backend/stage/.m2/repository
    policy: pull-push 

# Frontend linting job
# This job runs ESLint to check for code quality and style issues in the Frontend code
frontend-lint:
  stage: test
  extends: .frontend-base
  image: node:20-alpine 
  script:
    - npm install
    - npm run lint # Run the lint command defined in package.json
  cache:
    key: 
      files:
        - Frontend/package-lock.json
    paths:
      - Frontend/node_modules/
    policy: pull-push


# Frontend Unit Tests
# This job runs the Frontend unit tests using Vitest
frontendtest:
  stage: test
  extends: .frontend-base
  image: node:18-alpine 
  script:
    - npm install
    - npm run test:coverage # Run the test command defined in package.json
  artifacts:
    when:
      always: true # Always save these artifacts, even if the job fails
    paths:
      - Frontend/coverage/ # Save the coverage report generated by Vitest
      - Frontend/test-results.xml # Save the test results in JUnit format
    reports:
      junit: Frontend/test-results.xml # JUnit test report for CI visibility
      coverage_report: 
        coverage_format: cobertura # Specify the format of the coverage report
        paths: Frontend/coverage/cobertura-coverage.xml # Path to the Cobertura coverage report
    expire_in: 1 week   
  cache:
    key: 
      files:
        - Frontend/package-lock.json
    paths:
      - Frontend/node_modules/
    policy: pull-push

# --- BUILD STAGE ---
# Template for building Docker images using Kaniko (secure & daemonless)
.build-kaniko-template:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.9.0-debug
    entrypoint: [""]
  script:
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - |
      echo "Building Docker image: ${CI_REGISTRY_IMAGE}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
    - /kaniko/executor --context "${CONTEXT_DIR}" --dockerfile "${DOCKERFILE_PATH}" --no-push --tarPath "${IMAGE_NAME}.tar"     # ONLY BUILD the Docker image - DON'T push to registry yet!
  artifacts:
    paths:
      - "*.tar"  # Save the Docker image as a file
    expire_in: 1 hour

backend-build:
  extends: .build-kaniko-template
  needs: [backend-test]
  variables:
    CONTEXT_DIR: "$CI_PROJECT_DIR/Backend/stage"
    DOCKERFILE_PATH: "$CI_PROJECT_DIR/Backend/stage/Dockerfile"
    IMAGE_NAME: "backend"

frontend-build:
  extends: .build-kaniko-template
  needs: [frontend-lint]
  variables:
    CONTEXT_DIR: "$CI_PROJECT_DIR/Frontend"
    DOCKERFILE_PATH: "$CI_PROJECT_DIR/Frontend/Dockerfile"
    IMAGE_NAME: "frontend"

# --- PUBLISH STAGE ---
# Template for publishing Docker images to GitLab registry
.publish-template:
  stage: publish
  image:
    name: gcr.io/kaniko-project/executor:v1.9.0-debug
    entrypoint: [""]
  script:
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - |
      # Load the Docker image from the tar file and push to registry
      DESTINATIONS="--destination ${CI_REGISTRY_IMAGE}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
      if [ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]; then
        DESTINATIONS="${DESTINATIONS} --destination ${CI_REGISTRY_IMAGE}/${IMAGE_NAME}:latest"
      fi
      echo "Publishing to GitLab registry: ${DESTINATIONS}"
    # Push the pre-built image to GitLab registry
    - /kaniko/executor --tarPath "${IMAGE_NAME}.tar" ${DESTINATIONS}

backend-publish:
  extends: .publish-template
  needs: 
    - job: backend-build
      artifacts: true
  variables:
    IMAGE_NAME: "backend"

frontend-publish:
  extends: .publish-template
  needs: 
    - job: frontend-build
      artifacts: true
  variables:
    IMAGE_NAME: "frontend"

